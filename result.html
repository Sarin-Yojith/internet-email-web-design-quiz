<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz Result</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="bg-animation"></div>

  <main class="result-page">
    <div class="container py-5">
      <div class="result-box-main mx-auto text-center">
        <div class="neon-badge mb-3">QUIZ COMPLETED</div>
        <h1 class="main-title mb-4">Your Result</h1>

        <div id="resultContent" class="result-content"></div>

        <div class="mt-4 d-grid gap-3 col-12 col-sm-8 col-md-5 mx-auto">
          <a href="./quiz.html" class="btn btn-neon">Try Again</a>
          <a href="./index.html" class="btn btn-outline-neon">Back to Home</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    const result = JSON.parse(localStorage.getItem("quizResult"));
    const resultContent = document.getElementById("resultContent");

    if (result) {
      resultContent.innerHTML = `
        <div class="result-mark">${result.score} / ${result.total}</div>
        <div class="result-percent">Percentage: ${result.percentage}%</div>
      `;
    } else {
      resultContent.innerHTML = `<div class="result-percent">No result found.</div>`;
    }
  </script>
</body>
</html>
