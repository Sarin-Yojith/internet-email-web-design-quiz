<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">

  <style>
    .timer-box {
      padding: 12px 16px;
      border-radius: 16px;
      border: 1px solid rgba(0, 240, 255, 0.22);
      background: rgba(0, 240, 255, 0.06);
      box-shadow: 0 0 14px rgba(0, 240, 255, 0.08);
      min-width: 180px;
      text-align: center;
    }

    .timer-label {
      font-size: 12px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #9fb6cc;
      margin-bottom: 4px;
    }

    .timer-value {
      font-family: "Orbitron", sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
    }

    .timer-warning .timer-value {
      color: #ffd166;
      text-shadow: 0 0 12px rgba(255, 209, 102, 0.25);
    }

    .timer-danger .timer-value {
      color: #ff5c8a;
      text-shadow: 0 0 12px rgba(255, 92, 138, 0.25);
    }
  </style>
</head>
<body class="no-copy">
  <div class="bg-animation"></div>

  <main class="quiz-page">
    <div class="container py-4 py-md-5">
      <div class="quiz-shell mx-auto">
        <div class="quiz-topbar">
          <div>
            <div class="neon-badge mb-2">PRACTICE QUIZ</div>
            <h1 class="quiz-main-title mb-1">Internet Email and Web Design Quiz</h1>
            <p class="quiz-subtext mb-0">Answer all questions and submit to view your marks.</p>
          </div>

          <div class="d-flex flex-wrap gap-2 align-items-center">
            <div id="timerBox" class="timer-box">
              <div class="timer-label">Time Remaining</div>
              <div id="timerDisplay" class="timer-value">01:30:00</div>
            </div>
            <a href="./index.html" class="btn btn-outline-neon">Home</a>
          </div>
        </div>

        <div class="progress-wrap mt-4">
          <div class="progress-info">
            <span id="questionCounter">Question 1 of 60</span>
            <span id="progressPercent">2%</span>
          </div>
          <div class="custom-progress">
            <div id="progressBar" class="custom-progress-bar"></div>
          </div>
        </div>

        <div class="question-card mt-4">
          <div id="questionNumber" class="question-number">Question 1</div>
          <h2 id="questionText" class="question-text mt-2"></h2>

          <div id="optionsContainer" class="options-list mt-4"></div>

          <div class="quiz-actions mt-4">
            <button id="prevBtn" class="btn btn-outline-neon" type="button">Previous</button>
            <button id="nextBtn" class="btn btn-neon" type="button">Next</button>
            <button id="submitBtn" class="btn btn-finish d-none" type="button">Submit Quiz</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="./js/quiz-data.js"></script>
  <script src="./js/protect.js"></script>
  <script src="./js/quiz.js"></script>
</body>
</html>
